<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-5">

    <!-- Main Card: split layout - left ID card preview, right form -->
    <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl w-full max-w-3xl border border-white/50 overflow-hidden md:flex">

        <!-- LEFT PANEL: Student ID card style -->
        <div class="md:w-[45%] bg-gradient-to-br from-indigo-600 to-pink-600 p-6 flex flex-col">
            <p class="text-indigo-100 text-xs font-semibold uppercase tracking-widest mb-1">Live Preview</p>
            <h2 class="text-white text-xl font-bold mb-4">Student ID Card</h2>

            <div class="bg-white/95 rounded-2xl p-6 shadow-lg">
                <div class="text-center mb-5">
                    <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-pink-500 rounded-full flex items-center justify-center shadow-lg">
                        <span class="text-4xl">👨‍🎓</span>
                    </div>
                </div>

                <!-- Output area (same id - JS change nahi karna) -->
                <div id="output"
                    class="bg-indigo-50 border-2 border-dashed border-indigo-300 rounded-xl p-6 text-gray-700 text-sm leading-relaxed min-h-[130px]">
                    Profile will show here...
                </div>
            </div>

            <div class="mt-auto pt-6 text-center">
                <div class="inline-block bg-white/15 border border-white/30 rounded-full px-6 py-2">
                    <p class="text-white text-base font-extrabold uppercase tracking-[0.2em]">Smit</p>
                </div>
                <p class="text-indigo-200 text-[10px] uppercase tracking-widest mt-1">Institute of Technology</p>
            </div>
        </div>

        <!-- RIGHT PANEL: Form -->
        <div class="md:w-[55%] p-8">

            <p class="text-indigo-500 text-xs font-semibold uppercase tracking-widest mb-1">Student Information</p>
            <h2 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-600 mb-6">Enter Your Details</h2>

            <!-- Name -->
            <label class="block text-sm font-semibold text-gray-600 mb-1">Full Name</label>
            <div class="flex items-center gap-3 bg-gray-50 border border-gray-200 rounded-xl px-4 mb-4 focus-within:border-indigo-400 focus-within:ring-4 focus-within:ring-indigo-100 transition">
                <span class="text-xl">👤</span>
                <input type="text" id="name" placeholder="Enter your name"
                    class="w-full py-3 bg-transparent text-gray-700 placeholder-gray-400 focus:outline-none">
            </div>

            <!-- Roll No -->
            <label class="block text-sm font-semibold text-gray-600 mb-1">Roll Number</label>
            <div class="flex items-center gap-3 bg-gray-50 border border-gray-200 rounded-xl px-4 mb-4 focus-within:border-indigo-400 focus-within:ring-4 focus-within:ring-indigo-100 transition">
                <span class="text-xl">🆔</span>
                <input type="text" id="roll" placeholder="Enter roll number"
                    class="w-full py-3 bg-transparent text-gray-700 placeholder-gray-400 focus:outline-none">
            </div>

            <!-- Marks -->
            <label class="block text-sm font-semibold text-gray-600 mb-1">Marks (Out of 100)</label>
            <div class="grid grid-cols-3 gap-3 mb-6">
                <div>
                    <input type="number" id="math" placeholder="Math"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-3 text-center text-gray-700 placeholder-gray-400 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 focus:outline-none transition">
                    <p class="text-center text-xs text-gray-400 mt-1">📐 Math</p>
                </div>
                <div>
                    <input type="number" id="science" placeholder="Science"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-3 text-center text-gray-700 placeholder-gray-400 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 focus:outline-none transition">
                    <p class="text-center text-xs text-gray-400 mt-1">🔬 Science</p>
                </div>
                <div>
                    <input type="number" id="english" placeholder="English"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-3 text-center text-gray-700 placeholder-gray-400 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 focus:outline-none transition">
                    <p class="text-center text-xs text-gray-400 mt-1">📖 English</p>
                </div>
            </div>

            <!-- Buttons -->
            <button id="generateBtn"
                class="w-full bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-bold py-3.5 rounded-xl mb-3 transition transform hover:scale-[1.03] hover:shadow-xl hover:shadow-pink-200 active:scale-95">
                 Generate Profile
            </button>

            <button id="deleteBtn"
                class="w-full bg-white border-2 border-red-200 text-red-500 hover:bg-red-50 font-bold py-3.5 rounded-xl transition transform hover:scale-[1.03] active:scale-95">
                🗑️ Delete Grade
            </button>

        </div>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>
</body>

</html>
